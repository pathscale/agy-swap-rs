[workspace]
members = ["crates/agy-tui", "crates/agy-core", "bins/agy-swap"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pathscale/agy-swap-rs"

[workspace.dependencies]
ekostd = { version = "^0.2.13", default-features = false }
nagoya = { version = "^0.1.27", default-features = false, features = ["reactor"] }
nago-rustls = { version = "^0.2.3", default-features = false, features = ["webpki-roots"] }
nago-http = { version = "^0.2.3", default-features = false }
ps-rustcrypto = { version = "^0.6.2", default-features = false, features = ["alloc", "tls12", "zeroize", "rsa-pss"] }
webpki-roots = { version = "^1", default-features = false }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context"] }
agy-tui = { version = "0.2.0", path = "crates/agy-tui" }
agy-core = { version = "0.2.0", path = "crates/agy-core" }
