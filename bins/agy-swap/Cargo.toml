[package]
name = "agy-swap-rs"
publish = ["crates-io"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Multi-account quota TUI, isolated concurrent CLI wrapper (--use-account), and session switcher for Antigravity (agy)"
keywords = ["cli", "tui", "oauth", "quota"]
categories = ["command-line-utilities"]

[[bin]]
name = "agy-swap-rs"
path = "src/main.rs"

[dependencies]
agy-core = { workspace = true }
agy-tui = { workspace = true }
ekostd = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
